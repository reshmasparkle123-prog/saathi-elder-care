<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Saathi - Elder Care AI</title>
<style>
  body { background:#0f1024; color:#e8e8f5; font-family:Arial,sans-serif; margin:0; padding:40px; }
  .wrap { max-width:700px; margin:0 auto; text-align:center; }
  h1 { color:#a78bfa; font-size:48px; margin-bottom:0; }
  .sub { color:#9ca3af; margin-top:4px; }
  .lang-toggle { margin-top:16px; display:flex; justify-content:center; gap:8px; }
  .lang-btn { padding:8px 20px; border-radius:20px; border:1px solid #3f3f6b; background:#1e1f3b; color:#cbd5e1; font-size:14px; cursor:pointer; }
  .lang-btn.active { background:#7c3aed; color:#fff; border-color:#7c3aed; }
  .chatbox { background:#1e1f3b; border-radius:12px; padding:24px; margin-top:24px; min-height:150px; text-align:left; font-size:18px; }
  .row { display:flex; gap:8px; margin-top:16px; }
  input[type=text] { flex:1; padding:14px; border-radius:8px; border:none; background:#2a2b4d; color:#fff; font-size:16px; }
  button { padding:14px 24px; border-radius:8px; border:none; background:#7c3aed; color:#fff; font-size:16px; cursor:pointer; }
  button:hover { background:#6d28d9; }
  .mic { background:#2563eb; }
  .mic.listening { background:#dc2626; }
  .panels { display:flex; gap:16px; margin-top:24px; text-align:left; }
  .panel { flex:1; background:#1e1f3b; border-radius:12px; padding:16px; }
  .panel h3 { margin-top:0; color:#a78bfa; font-size:16px; }
  .panel ul { list-style:none; padding:0; margin:0; font-size:14px; color:#cbd5e1; }
  .panel li { padding:8px 0; border-bottom:1px solid #2a2b4d; }
  .panel li:last-child { border-bottom:none; }
  .empty { color:#6b7280; font-style:italic; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Saathi</h1>
  <div class="sub">Your AI Elder Care Companion</div>

  <div class="lang-toggle">
    <button class="lang-btn active" id="langEnBtn" onclick="setLanguage('en')">English</button>
    <button class="lang-btn" id="langHiBtn" onclick="setLanguage('hi')">हिंदी / Hinglish</button>
  </div>

  <div class="chatbox" id="chatbox">Hello! How can I help you today?</div>

  <div class="row">
    <input type="text" id="msgInput" placeholder="Type your message...">
    <button class="mic" id="micBtn" onclick="toggleVoice()" aria-label="Start voice input">🎤</button>
    <button onclick="sendMessage()" aria-label="Send message">Send</button>
  </div>

  <div class="panels">
    <div class="panel">
      <h3>💊 Reminders</h3>
      <ul id="remindersList"><li class="empty">None yet</li></ul>
    </div>
    <div class="panel">
      <h3>👨‍👩‍👧 Family Updates</h3>
      <ul id="familyList"><li class="empty">None yet</li></ul>
    </div>
  </div>
</div>

<script>
const USER_ID = "demo";
const API = "http://localhost:8001";
const chatbox = document.getElementById("chatbox");
const msgInput = document.getElementById("msgInput");

let currentLanguage = "en";
let availableVoices = [];
let isSending = false;

const GREETINGS = {
  en: "Hello! How can I help you today?",
  hi: "Namaste! Aap kaise ho? Main aapki kaise madad kar sakta hoon?"
};

function loadVoices() {
  availableVoices = speechSynthesis.getVoices();
}
loadVoices();
if (speechSynthesis.onvoiceschanged !== undefined) {
  speechSynthesis.onvoiceschanged = loadVoices;
}

function pickVoice(lang) {
  const langPrefix = lang === "hi" ? "hi" : "en";
  let voice = availableVoices.find(v => v.lang.toLowerCase().startsWith(langPrefix) && v.localService);
  if (!voice) voice = availableVoices.find(v => v.lang.toLowerCase().startsWith(langPrefix));
  return voice || null;
}

function setLanguage(lang) {
  currentLanguage = lang;
  document.getElementById("langEnBtn").classList.toggle("active", lang === "en");
  document.getElementById("langHiBtn").classList.toggle("active", lang === "hi");
  chatbox.innerText = GREETINGS[lang];
}

msgInput.addEventListener("keypress", e => { if (e.key === "Enter") sendMessage(); });

async function sendMessage() {
  const msg = msgInput.value.trim();
  if (!msg || isSending) return;
  isSending = true;
  chatbox.innerText = "...";
  msgInput.value = "";
  try {
    const res = await fetch(`${API}/chat`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user_id: USER_ID, message: msg, language: currentLanguage })
    });
    if (!res.ok) throw new Error("Server error");
    const data = await res.json();
    chatbox.innerText = data.response;
    speak(data.response);
    refreshPanels();
  } catch (err) {
    chatbox.innerText = currentLanguage === "en"
      ? "Connection error. Please check the server is running and try again."
      : "Connection error. Server check kijiye aur dobara try kijiye.";
  } finally {
    isSending = false;
  }
}

async function refreshPanels() {
  try {
    const r = await fetch(`${API}/reminders/${USER_ID}`);
    const reminders = await r.json();
    const rl = document.getElementById("remindersList");
    rl.innerHTML = reminders.length
      ? reminders.map(x => `<li>💊 ${x.medicine} — ${x.time}</li>`).join("")
      : '<li class="empty">None yet</li>';

    const f = await fetch(`${API}/family-updates/${USER_ID}`);
    const updates = await f.json();
    const fl = document.getElementById("familyList");
    fl.innerHTML = updates.length
      ? updates.map(x => `<li>💬 ${x.message}</li>`).join("")
      : '<li class="empty">None yet</li>';
  } catch (err) {
    console.error("Could not refresh panels", err);
  }
}

function speak(text) {
  if (!("speechSynthesis" in window) || !text) return;
  speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  const voice = pickVoice(currentLanguage);
  if (voice) utter.voice = voice;
  utter.lang = currentLanguage === "hi" ? "hi-IN" : "en-US";
  utter.rate = 1.0;
  utter.pitch = 1.0;
  utter.volume = 1.0;
  speechSynthesis.speak(utter);
}

let recognition;
let listening = false;

function toggleVoice() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    alert("Voice input not supported in this browser. Try Chrome.");
    return;
  }
  const micBtn = document.getElementById("micBtn");

  if (listening) {
    recognition.stop();
    return;
  }

  recognition = new SpeechRecognition();
  recognition.lang = currentLanguage === "hi" ? "hi-IN" : "en-US";
  recognition.interimResults = false;

  recognition.onstart = () => { listening = true; micBtn.classList.add("listening"); };
  recognition.onend = () => { listening = false; micBtn.classList.remove("listening"); };
  recognition.onresult = (event) => {
    const transcript = event.results[0][0].transcript;
    msgInput.value = transcript;
    sendMessage();
  };
  recognition.onerror = () => { listening = false; micBtn.classList.remove("listening"); };

  recognition.start();
}

refreshPanels();

// ---------- Alarm system ----------
const triggeredToday = new Set();

function parseTimeToMinutes(timeStr) {
  if (!timeStr || typeof timeStr !== "string") return null;
  const cleaned = timeStr.trim().toLowerCase().replace(/\s+/g, "");
  let match = cleaned.match(/^(\d{1,2}):?(\d{2})?(am|pm)?$/);
  if (!match) return null;

  let [, hourStr, minStr, ampm] = match;
  let hour = parseInt(hourStr, 10);
  let min = minStr ? parseInt(minStr, 10) : 0;

  if (ampm === "pm" && hour !== 12) hour += 12;
  if (ampm === "am" && hour === 12) hour = 0;

  return hour * 60 + min;
}

function playAlarmSound() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const toneA = 740;
  const toneB = 587;
  let ring = 0;

  function playTonePair() {
    [toneA, toneB].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = "sine";
      osc.frequency.value = freq;
      const startTime = ctx.currentTime + i * 0.22;
      gain.gain.setValueAtTime(0.0001, startTime);
      gain.gain.exponentialRampToValueAtTime(0.35, startTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.2);
      osc.start(startTime);
      osc.stop(startTime + 0.22);
    });
  }

  const interval = setInterval(() => {
    playTonePair();
    ring++;
    if (ring >= 4) clearInterval(interval);
  }, 700);
  playTonePair();
}

function showAlarmBanner(medicine, time) {
  const existing = document.getElementById("alarmBanner");
  if (existing) existing.remove();

  const banner = document.createElement("div");
  banner.id = "alarmBanner";
  banner.style.cssText = `
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: #dc2626; color: white; padding: 20px 32px; border-radius: 12px;
    font-size: 20px; font-weight: bold; z-index: 9999; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    display: flex; align-items: center; gap: 16px;
  `;
  banner.innerHTML = `
    ⏰ Time for: ${medicine} (${time})
    <button id="dismissAlarm" style="padding:8px 16px; border-radius:6px; border:none; background:white; color:#dc2626; font-weight:bold; cursor:pointer;">Dismiss</button>
  `;
  document.body.appendChild(banner);

  document.getElementById("dismissAlarm").onclick = () => banner.remove();

  const msg = currentLanguage === "hi"
    ? `Samay ho gaya hai. Kripya apni ${medicine} lein.`
    : `It's time to take your ${medicine}.`;
  speak(msg);
}

async function checkAlarms() {
  try {
    const r = await fetch(`${API}/reminders/${USER_ID}`);
    const reminders = await r.json();
    const now = new Date();
    const nowMinutes = now.getHours() * 60 + now.getMinutes();
    const todayKey = now.toDateString();

    reminders.forEach(rem => {
      const remMinutes = parseTimeToMinutes(rem.time);
      if (remMinutes === null) return;

      const triggerKey = `${todayKey}-${rem.medicine}-${rem.time}`;
      if (remMinutes <= nowMinutes && !triggeredToday.has(triggerKey)) {
        triggeredToday.add(triggerKey);
        playAlarmSound();
        showAlarmBanner(rem.medicine, rem.time);
      }
    });
  } catch (err) {
    console.error("Alarm check failed", err);
  }
}

setInterval(checkAlarms, 30000);
checkAlarms();
</script>
</body>
</html>
